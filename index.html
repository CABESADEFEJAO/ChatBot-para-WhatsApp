<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp PDF Scanner</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #ffffff;
        background: #1b1f24;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid #333;
        background: #111419;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
      }
      .layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 16px;
        padding: 16px;
      }
      .panel {
        background: #161b20;
        border: 1px solid #2e343c;
        border-radius: 12px;
        padding: 16px;
      }
      .panel h2 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 18px;
      }
      .status-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .status-box {
        background: #111419;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #2e343c;
        width: 100%;
      }
      .status-box strong {
        display: block;
        margin-bottom: 6px;
        color: #b7c3d2;
      }
      .log-wrapper {
        height: 360px;
        overflow-y: auto;
        padding: 10px;
        background: #0f1318;
        border-radius: 10px;
        border: 1px solid #2e343c;
      }
      .log-line {
        font-size: 12px;
        line-height: 1.4;
        margin-bottom: 6px;
        white-space: pre-wrap;
      }
      .log-line.warn {
        color: #f0c674;
      }
      .log-line.error {
        color: #ff7373;
      }
      .panel table {
        width: 100%;
        border-collapse: collapse;
      }
      .panel table th,
      .panel table td {
        padding: 10px 8px;
        text-align: left;
        border-bottom: 1px solid #2e343c;
      }
      .panel table th {
        color: #aab3c2;
        font-size: 12px;
        letter-spacing: 0.03em;
      }
      .panel table tr:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .controls button,
      .controls input {
        border: 1px solid #2e343c;
        border-radius: 10px;
        background: #0f1318;
        padding: 10px 12px;
        color: #fff;
      }
      .controls button {
        cursor: pointer;
      }
      .controls input {
        flex: 1;
      }
      .empty {
        color: #777;
        text-align: center;
      }
      footer {
        padding: 16px 24px 24px;
        font-size: 13px;
        color: #8f98a3;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WhatsApp PDF Scanner</h1>
    </header>

    <div class="layout">
      <section class="panel">
        <h2>Status</h2>
        <div class="status-box">
          <strong>Status da conexão:</strong>
          <span id="statusLabel">Aguardando inicialização...</span>
        </div>

        <h2 style="margin-top:24px;">Logs</h2>
        <div class="log-wrapper" id="logContainer"></div>
      </section>

      <section class="panel">
        <div class="status-row">
          <div class="status-box" style="flex: 1;">
            <strong>Lista de PDFs</strong>
            <div class="controls">
              <button id="refreshButton" type="button">Atualizar lista</button>
              <button id="openFolderButton" type="button">Abrir pasta</button>
            </div>
          </div>
        </div>

        <div style="margin-top:16px;">
          <div class="controls">
            <input id="scanCountInput" type="number" min="1" value="10" placeholder="Últimas conversas" />
            <button id="scanChatsButton" type="button">Escanear conversas</button>
          </div>
          <div class="controls" style="margin-top:12px;">
            <button id="uploadToDbButton" type="button" style="flex: 1;">Upload para Banco de Dados</button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th></th>
              <th>Nome</th>
              <th>Tamanho</th>
              <th>Atualizado</th>
            </tr>
          </thead>
          <tbody id="pdfListBody"></tbody>
        </table>
      </section>
    </div>

    <footer>
      Use esta UI para escanear o QR code, ver os PDFs recebidos e disparar o envio para a API do banco.
    </footer>

    <script src="renderer.js"></script>
  </body>
</html>
